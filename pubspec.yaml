name: expense_eye
description: "ExpenseEye - A smart expense tracking app to manage your finances effectively."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  sqflite: ^2.3.2
  path: ^1.8.3
  intl: ^0.20.2
  fl_chart: ^1.1.1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  google_fonts: ^8.0.1
  share_plus: ^12.0.1
  path_provider: ^2.1.2
  pdf: ^3.10.7
  screenshot: ^3.0.0
  universal_html: ^2.2.4
  permission_handler: ^12.0.1
  flutter_launcher_icons: ^0.14.3
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
